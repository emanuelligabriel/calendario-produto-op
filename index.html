<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendário de Lançamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#f1f1f0; --surface:#ffffff; --surface2:#f6f6f5; --ink:#252627; --muted:#66686a;
  --line:#dcdcdc; --line-strong:#c4c4c4;
  --accent:#fecf43; --accent-hover:#e49d21; --on-accent:#252627; --accent-soft:#fff2bf; --accent-text:#8c3210;
  --sel-bg:#252627; --sel-ink:#fecf43; --focus:#252627;
  --ok:#1f6b45; --ok-soft:#dff0e6; --warn:#8c3210; --warn-soft:#fde5d3; --bad:#b3261e; --bad-soft:#fadcd9;
  --c-geral:#1d5a9e; --c-geral-soft:#dbe9fb;
  --c-segm:#5b3fa8; --c-segm-soft:#e9e3fb;
  --c-nps:#a8275f; --c-nps-soft:#fbdfe9;
  --c-periodo:#4a4f57; --c-periodo-soft:#e4e6e9;
  --hd:#252627; --hd-ink:#f4f4f2; --hd-muted:#b9bbbd; --hd-grid:rgba(254,207,67,.09);
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --code:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#181819; --surface:#252627; --surface2:#1f2021; --ink:#f4f4f2; --muted:#a4a6a8;
    --line:#3a3c3d; --line-strong:#505253;
    --accent-soft:#3a3320; --accent-text:#fecf43; --sel-bg:#fecf43; --sel-ink:#252627; --focus:#fecf43;
    --ok:#6fcf97; --ok-soft:#1d3327; --warn:#f0a96b; --warn-soft:#3d2a1b; --bad:#f28b82; --bad-soft:#3f2321;
    --c-geral:#8ab4f0; --c-geral-soft:#1c2d42;
    --c-segm:#b79cf2; --c-segm-soft:#2c2440;
    --c-nps:#e88ab0; --c-nps-soft:#3a2030;
    --c-periodo:#b7bcc3; --c-periodo-soft:#33373d;
    --hd:#252627; --hd-grid:rgba(254,207,67,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#181819; --surface:#252627; --surface2:#1f2021; --ink:#f4f4f2; --muted:#a4a6a8;
  --line:#3a3c3d; --line-strong:#505253;
  --accent-soft:#3a3320; --accent-text:#fecf43; --sel-bg:#fecf43; --sel-ink:#252627; --focus:#fecf43;
  --ok:#6fcf97; --ok-soft:#1d3327; --warn:#f0a96b; --warn-soft:#3d2a1b; --bad:#f28b82; --bad-soft:#3f2321;
  --c-geral:#8ab4f0; --c-geral-soft:#1c2d42;
  --c-segm:#b79cf2; --c-segm-soft:#2c2440;
  --c-nps:#e88ab0; --c-nps-soft:#3a2030;
  --c-periodo:#b7bcc3; --c-periodo-soft:#33373d;
  --hd:#252627; --hd-grid:rgba(254,207,67,.07);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--sans);padding-inline:16px;padding-block:20px 40px;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:16px;padding:18px 20px;border-radius:6px;background-color:var(--hd);color:var(--hd-ink);border:1px solid var(--line);
  background-image:linear-gradient(var(--hd-grid) 1px,transparent 1px),linear-gradient(90deg,var(--hd-grid) 1px,transparent 1px);background-size:28px 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;letter-spacing:.02em;width:100%}
.brand .mark{width:16px;height:16px;background:var(--accent);border-radius:2px;box-shadow:6px 6px 0 -1px #e58b12}
.brand .wm{font-weight:700;font-size:15px}
.brand .area{color:var(--hd-muted);font-weight:400}
h1{font-size:24px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--hd-muted);margin:4px 0 0;font-size:13px;font-weight:300}
.hd-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.btn{font:inherit;font-weight:600;border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
/* .btn.ghost é claro-sobre-escuro por padrão só dentro do cabeçalho (fundo escuro);
   em qualquer outro lugar (card, toolbar, modal) é escuro-sobre-claro — evita o bug de
   texto "invisível" (claro sobre claro) fora do cabeçalho. */
.btn.ghost{background:none;color:var(--ink);border-color:var(--line-strong);font-weight:500}
.btn.ghost:hover{background:var(--surface2);border-color:var(--ink)}
header.top .btn.ghost{color:var(--hd-ink);border-color:#575a5b}
header.top .btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.nav{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid #575a5b;border-radius:4px;padding:3px}
.nav button{font:inherit;border:0;background:none;color:var(--hd-ink);width:30px;height:30px;border-radius:3px;cursor:pointer;font-size:16px}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav b{padding:0 8px;font-size:14px;min-width:150px;text-align:center}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:16px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:20px;padding:5px 11px 5px 8px;font-size:12.5px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--muted)}
.lg i{width:9px;height:9px;border-radius:50%;display:block}
.lg[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-strong,var(--ink))}
.lg[aria-pressed="false"]{opacity:.45}
.filters2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters2 select{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
#btn-ics{margin-left:auto}
.view-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.view-toggle .vt{font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.view-toggle .vt[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink)}
.view-toggle .vt+.vt{border-left:1px solid var(--line-strong)}
.grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px}
.grid-inner{min-width:640px}
#wrap[data-view="lista"] .grid-scroll{display:none}
#wrap[data-view="grade"] .agenda{display:none}
#scroll-hint{display:none}
@media (max-width:700px){#wrap[data-view="grade"] #scroll-hint{display:block}}
.month-grid{display:grid;gap:10px;margin-top:4px}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 2px}
.week{display:grid;gap:3px}
.week-banners{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;min-height:0}
.banner{border-radius:4px;padding:3px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid transparent}
.week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{height:92px;border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:3px;background:var(--surface);overflow:hidden}
.day.other{opacity:.4}
.day .num{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;justify-content:flex-end}
.day.today .num span{color:var(--on-accent);background:var(--accent);border-radius:3px;width:19px;height:19px;display:flex;align-items:center;justify-content:center}
.chip-ev{font-size:11px;border-radius:3px;padding:2px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border:1px solid transparent}
.chip-ev[draggable="true"],.banner[draggable="true"]{cursor:grab}
.chip-ev.dragging,.banner.dragging{opacity:.35}
.day.dragover{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.chip-ev .ic{opacity:.8;margin-right:3px}
.day .more{font-size:10.5px;color:var(--muted);cursor:pointer;padding:1px 2px;font-weight:500}
.agenda .day-group{border-top:1px solid var(--line);padding:12px 2px}
.agenda .day-group:first-child{border-top:0}
.agenda h4{margin:0 0 8px;font-size:13px;font-weight:600;text-transform:capitalize}
.agenda .ev-row{display:flex;gap:8px;align-items:center;padding:6px 4px;cursor:pointer;border-radius:4px}
.agenda .ev-row:hover{background:var(--surface2)}
.agenda .dot{width:9px;height:9px;border-radius:50%;flex:none}
.agenda .tt{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agenda .tg{font-size:11px;color:var(--muted)}
@media (max-width:480px){
  .grid-inner{min-width:560px}
}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;overflow:auto}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);margin:auto}
.modal-box h3{margin:0 0 4px;font-size:16px}
.modal-box p{margin:0 0 10px;color:var(--muted)}
.modal-box .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.field{display:grid;gap:4px;margin-bottom:10px}
.field>span{font-size:12.5px;font-weight:500}
.field small{color:var(--muted);font-size:12px;font-weight:300}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=date],input[type=number],input[type=password],input[type=url],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:56px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:4px;padding:3px 8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.al{border-radius:4px;padding:9px 12px;font-size:13px;margin-top:8px}
.al.bad{background:var(--bad-soft);color:var(--bad)}
.al.ok{background:var(--ok-soft);color:var(--ok)}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px;font-weight:300}
.pill-status{position:fixed;left:0;right:0;bottom:0;z-index:5;display:none;justify-content:center;gap:10px;background:var(--hd);color:var(--hd-ink);border-top:3px solid var(--accent);padding:9px 16px;font-size:13px}
.catdot-feriado{background:var(--bad)}
.catdot-aviso-geral{background:var(--c-geral)}
.catdot-aviso-segmentado{background:var(--c-segm)}
.catdot-promocao{background:var(--warn)}
.catdot-lancamento-sistema{background:var(--ok)}
.catdot-disparo-nps{background:var(--c-nps)}
.catdot-periodo-importante{background:var(--c-periodo)}
.cat-feriado{background:var(--bad-soft);color:var(--bad)}
.cat-aviso-geral{background:var(--c-geral-soft);color:var(--c-geral)}
.cat-aviso-segmentado{background:var(--c-segm-soft);color:var(--c-segm)}
.cat-promocao{background:var(--warn-soft);color:var(--warn)}
.cat-lancamento-sistema{background:var(--ok-soft);color:var(--ok)}
.cat-disparo-nps{background:var(--c-nps-soft);color:var(--c-nps)}
.cat-periodo-importante{background:var(--c-periodo-soft);color:var(--c-periodo)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
@media (max-width:640px){
  .f2{grid-template-columns:1fr}
  header.top{padding:14px 16px}
  h1{font-size:20px}
  .nav b{min-width:120px;font-size:13px}
}
</style>

<div class="wrap" id="wrap" data-view="grade">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span class="wm">Obra Prima</span><span class="area">Marketing · Calendário de Lançamentos</span></div>
    <div>
      <h1>Calendário de Lançamentos</h1>
      <p class="sub">Avisos, promoções, lançamentos de sistema e datas importantes — tudo num lugar só</p>
    </div>
    <div class="hd-right">
      <div class="nav">
        <button type="button" id="nav-prev" aria-label="Mês anterior">‹</button>
        <b id="nav-label">—</b>
        <button type="button" id="nav-next" aria-label="Próximo mês">›</button>
      </div>
      <button type="button" class="btn ghost small" id="btn-hoje">Hoje</button>
      <span id="quem-sou" class="hint" style="margin:0 2px;display:none;color:var(--hd-muted)"></span>
      <button type="button" class="btn ghost small" id="btn-usuarios" hidden>Usuários</button>
      <button type="button" class="btn ghost small" id="btn-editor">Entrar</button>
      <button type="button" class="btn ghost small" id="btn-importar" hidden>Importar planejamento</button>
      <button type="button" class="btn small" id="btn-novo" hidden>+ Novo</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="legend" id="legend"></div>
    <div class="filters2">
      <input type="text" id="f-busca" placeholder="Buscar por título, grupo ou resumo…" style="min-width:220px">
      <select id="f-canal"><option value="">Todos os canais</option></select>
      <select id="f-resp"><option value="">Todos os responsáveis</option></select>
      <select id="f-grupo"><option value="">Todos os grupos</option></select>
    </div>
    <button type="button" class="btn ghost small" id="btn-ics">Exportar .ics</button>
    <div class="view-toggle" role="group" aria-label="Visualização">
      <button type="button" class="vt" data-view="grade" aria-pressed="true">▦ Grade</button>
      <button type="button" class="vt" data-view="lista" aria-pressed="false">☰ Lista</button>
    </div>
  </div>

  <div class="card">
    <p class="hint" id="scroll-hint" style="margin:0 0 8px">⇆ Arraste pro lado pra ver os outros dias da semana</p>
    <div class="grid-scroll" id="grid-scroll">
      <div class="grid-inner">
        <div class="dow-row" id="dow-row"></div>
        <div class="month-grid" id="month-grid"></div>
      </div>
    </div>
    <div class="agenda" id="agenda"></div>
    <div class="empty" id="empty" hidden>Nenhum evento neste mês com os filtros atuais.</div>
  </div>
</div>

<div class="modal-ov" id="modal-ov" hidden><div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div></div>
<div class="pill-status" id="status"></div>

<script>

/* ---------- datas (UTC, para não deslizar com fuso) ---------- */
function toISO(d){return d.getUTCFullYear()+'-'+z2(d.getUTCMonth()+1)+'-'+z2(d.getUTCDate());}
function fromISO(s){var p=String(s||'').split('-').map(Number);return new Date(Date.UTC(p[0]||2026,(p[1]||1)-1,p[2]||1));}
function addDays(d,n){var r=new Date(d.getTime());r.setUTCDate(r.getUTCDate()+n);return r;}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());}
function fmtBR(iso){var p=String(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:'';}
function fmtDataHoraBR(iso){
  var d=new Date(iso);if(isNaN(d.getTime()))return '';
  return z2(d.getDate())+'/'+z2(d.getMonth()+1)+'/'+d.getFullYear()+' às '+z2(d.getHours())+':'+z2(d.getMinutes());
}
function mondayOnOrBefore(d){var dow=(d.getUTCDay()+6)%7;return addDays(d,-dow);}

  return SEED.map(function(e,i){return Object.assign({},e,{id:'seed'+i,rev:1,lembreteEnviadoEm:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});});
}

/* ---------- API ---------- */
function api(method,qs,body){
  var headers={'Content-Type':'application/json'};
  if(method!=='GET')headers['x-requested-with']='cal';
  return fetch('/api/'+qs,{method:method,headers:headers,credentials:'same-origin',body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(data){return {status:r.status,data:data};});});
}

function carregar(){
  fetch('/api/eventos',{credentials:'same-origin'}).then(function(r){
    if(!r.ok && r.status!==503)throw new Error('http '+r.status);
    return r.json().then(function(data){return {status:r.status,data:data};});
  }).then(function(r){
    if(r.status===200){
      storeMode='server';events=r.data.items||[];
      api('GET','auth').then(function(a){
        sessao=(a.data&&a.data.logged)?{email:a.data.email,nome:a.data.nome,role:a.data.role}:null;
        atualizarBarraEdicao();render();
        verificarConvitePendente();
      });
      if(!events.length){setStatus('Calendário vazio. Peça pra um administrador entrar e importar o planejamento.','warn');}
      render();
    }else{
      modoLocal();
    }
  }).catch(function(){modoLocal();});
}
function modoLocal(){
  storeMode='local';events=localLoad();sessao={email:'voce@local',nome:'Você (pré-visualização)',role:'adm'};atualizarBarraEdicao();
  setStatus('Sem servidor configurado: salvando só neste navegador (pré-visualização).','warn');
  render();
}

function atualizarBarraEdicao(){
  var logado=!!sessao;
  $('btn-editor').textContent=logado?'Sair':'Entrar';
  $('btn-novo').hidden=!podeEditar();
  $('btn-importar').hidden=!(podeEditar()&&storeMode==='server'&&events.length===0);
  $('btn-usuarios').hidden=!ehAdmin();
  var quem=$('quem-sou');
  if(logado){quem.style.display='';quem.textContent=(sessao.nome||sessao.email)+' · '+(ROLE_NOME[sessao.role]||sessao.role);}
  else{quem.style.display='none';quem.textContent='';}
}

/* ---------- login ---------- */
function pedirLogin(){
  showModal('<h3>Entrar</h3><p>Acesso de administrador(a) ou editor(a) do calendário.</p>'
    +'<div class="field"><span>E-mail</span><input type="text" id="m-email" autocomplete="username"></div>'
    +'<div class="field"><span>Senha</span><input type="password" id="m-senha" autocomplete="current-password"></div>'
    +'<p class="al bad" id="m-err" hidden style="margin:0 0 10px">E-mail ou senha incorretos.</p>'
    +'<div class="btns"><button type="button" class="btn" data-mact="login">Entrar</button>'
    +'<button type="button" class="btn ghost small" data-mact="cancel">Cancelar</button></div>'
    +'<p class="hint" style="margin:10px 0 0">Não tem conta? Peça um link de convite a um administrador.</p>');
  var i=$('m-email');if(i)i.focus();
}
function fazerLogin(){
  var email=$('m-email').value.trim();
  var senha=$('m-senha').value;
  api('POST','auth',{email:email,senha:senha}).then(function(r){
    if(r.status===200){sessao={email:r.data.email,nome:r.data.nome,role:r.data.role};hideModal();atualizarBarraEdicao();render();setStatus('Login efetuado.','ok');}
    else{$('m-err').hidden=false;}
  },function(){$('m-err').hidden=false;});
}
function fazerLogout(){
  api('DELETE','auth').then(function(){sessao=null;atualizarBarraEdicao();render();setStatus('Você saiu.');});
}

/* ---------- convite: criar conta a partir de um link de convite ---------- */
function verificarConvitePendente(){
  var m=location.search.match(/[?&]convite=([^&]+)/);
  if(!m)return;
  var token=decodeURIComponent(m[1]);
  api('GET','usuarios?acao=convite&token='+encodeURIComponent(token)).then(function(r){
    if(r.status===200&&r.data&&r.data.valido)abrirCadastroConvite(token,r.data.role);
    else setStatus('Esse link de convite não é mais válido (já usado ou expirado). Peça um novo.','bad');
  });
}
function abrirCadastroConvite(token,role){
  modalKind='convite';
  showModal('<h3>Criar sua conta</h3><p>Você foi convidado(a) como <b>'+esc(ROLE_NOME[role]||role)+'</b> do Calendário de Lançamentos.</p>'
    +'<div class="field"><span>Nome</span><input type="text" id="m-c-nome" maxlength="80"></div>'
    +'<div class="field"><span>E-mail</span><input type="text" id="m-c-email" autocomplete="username"></div>'
    +'<div class="field"><span>Senha</span><input type="password" id="m-c-senha" autocomplete="new-password"><small>Mínimo de 8 caracteres.</small></div>'
    +'<p class="al bad" id="m-err" hidden style="margin:0 0 10px"></p>'
    +'<div class="btns"><button type="button" class="btn" data-mact="resgatar" data-token="'+esc(token)+'">Criar conta e entrar</button></div>');
  var iC=$('m-c-nome');if(iC)iC.focus();
}
function resgatarConvite(token){
  var nome=$('m-c-nome').value.trim(),email=$('m-c-email').value.trim(),senha=$('m-c-senha').value;
  api('POST','usuarios?acao=resgatar',{token:token,nome:nome,email:email,senha:senha}).then(function(r){
    if(r.status===201){
      sessao={email:r.data.email,nome:r.data.nome,role:r.data.role};
      hideModal();atualizarBarraEdicao();render();
      history.replaceState(null,'',location.pathname);
      setStatus('Conta criada! Você já está logado(a).','ok');
    }else{
      var msg={email_ja_cadastrado:'Já existe uma conta com esse e-mail — tente entrar em vez de criar outra.',
        senha_curta:'A senha precisa ter pelo menos 8 caracteres.',email_invalido:'E-mail inválido.',
        nome_obrigatorio:'Preencha o nome.',convite_usado:'Esse convite já foi usado.',convite_expirado:'Esse convite expirou.'}[r.data&&r.data.error]||'Não foi possível criar a conta.';
      $('m-err').textContent=msg;$('m-err').hidden=false;
    }
  },function(){$('m-err').textContent='Sem conexão.';$('m-err').hidden=false;});
}

  if(!ehAdmin())return;
  modalKind='usuarios';
  showModal('<h3>Usuários</h3><p class="hint">Carregando…</p>');
  carregarUsuarios();
}
function carregarUsuarios(){
  api('GET','usuarios').then(function(r){
    if(r.status===200)renderUsuariosModal(r.data.itens||[]);
    else if(r.status===401){hideModal();pedirLogin();}
    else showModal('<h3>Usuários</h3><p class="al bad">Não foi possível carregar a lista agora.</p><div class="btns"><button type="button" class="btn ghost small" data-mact="cancel">Fechar</button></div>');
  });
}

function salvarForm(){
  var v=lerForm();
  if(!v.titulo||!v.dataInicio){$('m-err').textContent='Preencha pelo menos o título e a data de início.';$('m-err').hidden=false;return;}
  if(v.dataFim<v.dataInicio){$('m-err').textContent='A data de fim não pode ser antes da data de início.';$('m-err').hidden=false;return;}
  if(storeMode==='local'){
    var agoraLocal=new Date().toISOString();
    if(editId){
      events=events.map(function(x){
        if(x.id!==editId)return x;
        var camposMudados=Object.keys(v).filter(function(k){return CAMPO_NOME[k]&&JSON.stringify(v[k])!==JSON.stringify(x[k]);});
        var hist=(x.historico||[]).concat(camposMudados.length?[{em:agoraLocal,acao:'editado',campos:camposMudados,por:sessao.email}]:[]).slice(-15);
        return Object.assign({},x,v,{updatedAt:agoraLocal,historico:hist});
      });
    }else{
      events.push(Object.assign({},v,{id:'ev'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),rev:1,lembreteEnviadoEm:'',createdAt:agoraLocal,updatedAt:agoraLocal,historico:[{em:agoraLocal,acao:'criado',por:sessao.email}]}));
    }
    localSave();hideModal();render();setStatus('Salvo neste navegador.','ok');return;
  }
  var p=editId?api('PUT','eventos?id='+encodeURIComponent(editId),Object.assign({rev:(events.filter(function(x){return x.id===editId;})[0]||{}).rev},v)):api('POST','eventos',v);
  p.then(function(r){
    if(r.status===200||r.status===201){
      var it=r.data.item;
      if(editId)events=events.map(function(x){return x.id===it.id?it:x;});else events.push(it);
      hideModal();atualizarBarraEdicao();render();setStatus('Salvo.','ok');
    }else if(r.status===401){hideModal();pedirLogin();}
    else if(r.status===409){
      if(r.data&&r.data.item)events=events.map(function(x){return x.id===r.data.item.id?r.data.item:x;});
      $('m-err').textContent='Alguém mais atualizou esse evento enquanto você editava. Os dados mais recentes já foram recarregados — confira e salve de novo.';
      $('m-err').hidden=false;render();
    }else if(r.status===404){
      events=events.filter(function(x){return x.id!==editId;});
      $('m-err').textContent='Esse evento não existe mais (alguém deve ter excluído). Fechando o formulário.';
      $('m-err').hidden=false;render();setTimeout(hideModal,2200);
    }else{$('m-err').textContent='Não foi possível salvar agora.';$('m-err').hidden=false;}
  },function(){$('m-err').textContent='Sem conexão.';$('m-err').hidden=false;});
}
function excluir(id){
  var p=storeMode==='local'?Promise.resolve({status:200}):api('DELETE','eventos?id='+encodeURIComponent(id));

    if(r.status===200||r.status===404){
      events=events.filter(function(x){return x.id!==id;});

      hideModal();atualizarBarraEdicao();render();
      setStatus(r.status===404?'Esse evento já tinha sido excluído.':'Excluído.','ok');
    }else if(r.status===401){hideModal();pedirLogin();}
    else setStatus('Não foi possível excluir agora.','bad');
  });
}

/* ---------- arrastar e soltar pra reagendar ---------- */
function diffDays(aIso,bIso){return Math.round((fromISO(bIso)-fromISO(aIso))/86400000);}
function reagendar(id,novoDI,novoDF){
  var it=events.filter(function(x){return x.id===id;})[0];if(!it)return;
  if(novoDI===it.dataInicio&&novoDF===it.dataFim)return;
  if(storeMode==='local'){
    var agoraLocal=new Date().toISOString();
    events=events.map(function(x){
      if(x.id!==id)return x;
      var hist=(x.historico||[]).concat([{em:agoraLocal,acao:'editado',campos:['dataInicio','dataFim'],por:sessao.email}]).slice(-15);
      return Object.assign({},x,{dataInicio:novoDI,dataFim:novoDF,updatedAt:agoraLocal,historico:hist});
    });
    localSave();render();setStatus('Evento reagendado para '+fmtBR(novoDI)+'.','ok');return;
  }
  api('PUT','eventos?id='+encodeURIComponent(id),{rev:it.rev,dataInicio:novoDI,dataFim:novoDF}).then(function(r){
    if(r.status===200){
      var novo=r.data.item;
      events=events.map(function(x){return x.id===novo.id?novo:x;});
      render();setStatus('Evento reagendado para '+fmtBR(novoDI)+'.','ok');
    }else if(r.status===401){pedirLogin();}
    else if(r.status===409){
      if(r.data&&r.data.item)events=events.map(function(x){return x.id===r.data.item.id?r.data.item:x;});
      render();setStatus('Alguém mais atualizou esse evento — o arraste não foi aplicado. Tente de novo.','bad');
    }else if(r.status===404){
      events=events.filter(function(x){return x.id!==id;});render();setStatus('Esse evento já não existe mais.','bad');
    }else{setStatus('Não foi possível reagendar agora.','bad');}
  },function(){setStatus('Sem conexão.','bad');});
}
var dragId=null;
document.addEventListener('dragstart',function(e){
  var el=e.target.closest('.chip-ev[draggable="true"],.banner[draggable="true"]');
  if(!el)return;
  dragId=el.dataset.id;
  el.classList.add('dragging');
  if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId);}catch(err){}}
});
document.addEventListener('dragend',function(e){
  var el=e.target.closest('.chip-ev,.banner');
  if(el)el.classList.remove('dragging');
  document.querySelectorAll('.day.dragover').forEach(function(d){d.classList.remove('dragover');});
  dragId=null;
});
document.addEventListener('dragover',function(e){
  var dia=e.target.closest('.day[data-iso]');
  if(!dia||!dragId)return;
  e.preventDefault();
  if(e.dataTransfer)e.dataTransfer.dropEffect='move';
  dia.classList.add('dragover');
});
document.addEventListener('dragleave',function(e){
  var dia=e.target.closest('.day[data-iso]');
  if(dia&&!dia.contains(e.relatedTarget))dia.classList.remove('dragover');
});
document.addEventListener('drop',function(e){
  var dia=e.target.closest('.day[data-iso]');
  var id=dragId||(e.dataTransfer&&e.dataTransfer.getData('text/plain'));
  document.querySelectorAll('.day.dragover').forEach(function(d){d.classList.remove('dragover');});
  if(!dia||!id)return;
  e.preventDefault();
  var it=events.filter(function(x){return x.id===id;})[0];if(!it)return;
  var delta=diffDays(it.dataInicio,dia.dataset.iso);
  if(!delta)return;
  reagendar(id,toISO(addDays(fromISO(it.dataInicio),delta)),toISO(addDays(fromISO(it.dataFim),delta)));
});

function monthLabel(y,m){var n=MESES[m];return n.charAt(0).toUpperCase()+n.slice(1)+' de '+y;}

function packBanners(items,weekDates){
  var ws=weekDates[0],we=weekDates[6];
  var cand=items.filter(function(it){return it.dataFim>it.dataInicio && fromISO(it.dataInicio)<=we && fromISO(it.dataFim)>=ws;});
  var withCols=cand.map(function(it){
    var s=fromISO(it.dataInicio)<ws?ws:fromISO(it.dataInicio);
    var e=fromISO(it.dataFim)>we?we:fromISO(it.dataFim);
    var startCol=Math.round((s-ws)/86400000)+1,endCol=Math.round((e-ws)/86400000)+1;
    return {it:it,startCol:startCol,endCol:endCol};
  }).sort(function(a,b){return a.startCol-b.startCol||(b.endCol-b.startCol)-(a.endCol-a.startCol);});
  var lanes=[];
  withCols.forEach(function(b){
    var lane=0;
    while(lanes[lane]!=null && lanes[lane]>=b.startCol)lane++;
    lanes[lane]=b.endCol;b.lane=lane;
  });
  return withCols;
}

function renderGrid(){
  var first=new Date(Date.UTC(viewY,viewM,1));
  var last=new Date(Date.UTC(viewY,viewM+1,0));
  var gridStart=mondayOnOrBefore(first);
  var gridEnd=addDays(mondayOnOrBefore(last),6);
  $('dow-row').innerHTML=DOWS.map(function(d){return '<div>'+d+'</div>';}).join('');
  var visiveis=events.filter(eventoVisivel);

  // monta as semanas e os "banners" (eventos de vários dias) de uma vez, pra achar a
  // maior quantidade de faixas usada em QUALQUER semana do mês — todas as semanas reservam
  // essa mesma altura de faixa, mesmo as que não têm nenhuma, pra as linhas não ficarem
  // "tortas" (cada semana com uma altura diferente).
  var semanas=[];
  var cursor=gridStart;
  while(cursor<=gridEnd){
    var weekDates=[];for(var i=0;i<7;i++)weekDates.push(addDays(cursor,i));
    semanas.push({dates:weekDates,banners:packBanners(visiveis,weekDates)});
    cursor=addDays(cursor,7);
  }
  var maxLaneMes=semanas.reduce(function(m,s){return s.banners.reduce(function(mm,b){return Math.max(mm,b.lane);},m);},-1);

  var any=false;
  var weeksHtml=semanas.map(function(s){
    var weekDates=s.dates,banners=s.banners;
    var bannersHtml='';
    if(maxLaneMes>=0){
      bannersHtml='<div class="week-banners" style="grid-template-rows:repeat('+(maxLaneMes+1)+',22px)">'+banners.map(function(b){
        var cat=CAT_BY_ID[b.it.categoria]||CAT_BY_ID['periodo-importante'];
        return '<div class="banner cat-'+cat.id+'" style="grid-column:'+b.startCol+' / '+(b.endCol+1)+';grid-row:'+(b.lane+1)+'" data-act="abrir" data-id="'+esc(b.it.id)+'"'+(podeEditar()?' draggable="true"':'')+'>'+esc(b.it.titulo)+'</div>';
      }).join('')+'</div>';
    }
    var daysHtml='<div class="week-days">'+weekDates.map(function(d){
      var iso=toISO(d);
      var inMonth=d.getUTCMonth()===viewM;
      var dayEvents=visiveis.filter(function(it){return it.dataFim===it.dataInicio && it.dataInicio===iso;});
      if(dayEvents.length)any=true;
      var shown=dayEvents.slice(0,2);
      var resto=dayEvents.length-shown.length;
      var chips=shown.map(function(it){
        var cat=CAT_BY_ID[it.categoria]||CAT_BY_ID['aviso-geral'];
        return '<div class="chip-ev cat-'+cat.id+'" data-act="abrir" data-id="'+esc(it.id)+'"'+(podeEditar()?' draggable="true"':'')+'>'+esc(it.titulo)+'</div>';
      }).join('')+(resto>0?'<div class="more" data-act="mais" data-dia="'+iso+'">+'+resto+' mais</div>':'');
      return '<div class="day'+(inMonth?'':' other')+(iso===TODAY?' today':'')+'" data-iso="'+iso+'"><div class="num">'+(d.getUTCDate()===1?MESES[d.getUTCMonth()].slice(0,3)+' ':'')+'<span>'+d.getUTCDate()+'</span></div>'+chips+'</div>';
    }).join('')+'</div>';
    return '<div class="week">'+bannersHtml+daysHtml+'</div>';
  });
  $('month-grid').innerHTML=weeksHtml.join('');
  return any || events.some(function(it){return eventoVisivel(it)&&it.dataFim>it.dataInicio;});
}

function renderAgenda(){
  var first=new Date(Date.UTC(viewY,viewM,1));
  var last=new Date(Date.UTC(viewY,viewM+1,0));
  var visiveis=events.filter(eventoVisivel).filter(function(it){
    return fromISO(it.dataInicio)<=last && fromISO(it.dataFim)>=first;
  });
  var porDia={};
  visiveis.forEach(function(it){
    var s=fromISO(it.dataInicio)<first?first:fromISO(it.dataInicio);
    var e=fromISO(it.dataFim)>last?last:fromISO(it.dataFim);
    var d=s;
    while(d<=e){var iso=toISO(d);(porDia[iso]=porDia[iso]||[]).push(it);d=addDays(d,1);}
  });
  var dias=Object.keys(porDia).sort();
  if(!dias.length){$('agenda').innerHTML='';return false;}
  $('agenda').innerHTML=dias.map(function(iso){
    var d=fromISO(iso);
    var label=DOWS[(d.getUTCDay()+6)%7]+', '+fmtBR(iso);
    var rows=porDia[iso].map(function(it){
      var cat=CAT_BY_ID[it.categoria]||CAT_BY_ID['aviso-geral'];
      return '<div class="ev-row" data-act="abrir" data-id="'+esc(it.id)+'"><span class="dot catdot-'+cat.id+'"></span><span class="tt">'+esc(it.titulo)+'</span><span class="tg">'+esc(cat.nome)+'</span></div>';
    }).join('');
    return '<div class="day-group"><h4>'+esc(label)+'</h4>'+rows+'</div>';
  }).join('');
  return true;
}

function render(){
  $('nav-label').textContent=monthLabel(viewY,viewM);
  renderLegend();
  var temGrid=renderGrid();
  var temAgenda=renderAgenda();
  $('empty').hidden=(temGrid||temAgenda);
}

/* ---------- exportar .ics (pra importar no Google Agenda, Outlook etc.) ---------- */
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function gerarICS(){
  var visiveis=events.filter(eventoVisivel);
  var agora=new Date();
  var stamp=agora.getUTCFullYear()+z2(agora.getUTCMonth()+1)+z2(agora.getUTCDate())+'T'+z2(agora.getUTCHours())+z2(agora.getUTCMinutes())+z2(agora.getUTCSeconds())+'Z';
  var linhas=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Obra Prima//Calendario de Lancamentos//PT','CALSCALE:GREGORIAN'];
  visiveis.forEach(function(it){
    var fimExclusivo=toISO(addDays(fromISO(it.dataFim),1)).replace(/-/g,'');
    var inicio=String(it.dataInicio).replace(/-/g,'');
    if(!/^\d{8}$/.test(inicio))return;
    var descPartes=[];
    if(it.resumo)descPartes.push(it.resumo);
    var flags=[];
    if(it.canal)flags.push('Canal: '+(CANAL_NOME[it.canal]||it.canal));
    if(it.publico)flags.push('Público: '+(PUB_NOME[it.publico]||it.publico));
    if(it.responsavel)flags.push('Responsável: '+(RESP_NOME[it.responsavel]||it.responsavel));
    if(flags.length)descPartes.push(flags.join(' · '));
    linhas.push('BEGIN:VEVENT');
    linhas.push('UID:'+it.id+'@calendario-obraprima');
    linhas.push('DTSTAMP:'+stamp);
    linhas.push('DTSTART;VALUE=DATE:'+inicio);
    linhas.push('DTEND;VALUE=DATE:'+fimExclusivo);
    linhas.push('SUMMARY:'+icsEscape(it.titulo));
    if(descPartes.length)linhas.push('DESCRIPTION:'+icsEscape(descPartes.join('\n')));
    linhas.push('CATEGORIES:'+icsEscape((CAT_BY_ID[it.categoria]||{}).nome||it.categoria));
    linhas.push('END:VEVENT');
  });
  linhas.push('END:VCALENDAR');
  return linhas.join('\r\n');
}
function exportarICSviaBlob(){
  try{
    var blob=new Blob([gerarICS()],{type:'text/calendar;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='calendario-lancamentos.ics';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    setStatus('Arquivo .ics gerado — importe no Google Agenda, Outlook etc.','ok');
  }catch(e){setStatus('Não foi possível gerar o arquivo .ics neste navegador.','bad');}
}
function exportarICS(){
  // dentro do preview de artefato do Claude, o link/Blob de download não funciona
  // (o viewer bloqueia downloads diretos) — usamos a capability "downloads" quando disponível.
  if(typeof window.claude!=='undefined'&&window.claude&&typeof window.claude.use==='function'){
    window.claude.use('downloads').then(function(downloads){
      if(!downloads){exportarICSviaBlob();return;}
      downloads.save({filename:'calendario-lancamentos.ics',data:gerarICS()}).then(function(){
        setStatus('Arquivo .ics gerado — importe no Google Agenda, Outlook etc.','ok');
      },function(err){
        if(err&&err.code==='declined')return;
        exportarICSviaBlob();
      });
    },function(){exportarICSviaBlob();});
  }else{
    exportarICSviaBlob();
  }
}

/* ---------- navegação ---------- */
function mudarMes(delta){
  viewM+=delta;
  if(viewM<0){viewM=11;viewY--;}
  if(viewM>11){viewM=0;viewY++;}
  render();
}

/* ---------- manter em dia: reconsulta ao voltar pra aba, e atualiza "hoje" à meia-noite ---------- */
function refrescar(){
  if(storeMode!=='server'||modalKind)return; // não busca durante edição, pra não perder o que a pessoa está digitando
  fetch('/api/eventos',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(data){
    if(data&&data.items){events=data.items;atualizarBarraEdicao();render();}
  }).catch(function(){});
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refrescar();});
window.addEventListener('focus',refrescar);
setInterval(refrescar,120000);
setInterval(function(){var novo=todayISO();if(novo!==TODAY){TODAY=novo;render();}},60000);

/* ---------- eventos globais ---------- */
document.addEventListener('click',function(e){
  if(e.target.id==='modal-ov')hideModal();
  var b=e.target.closest('[data-act],button');
  if(!b)return;
  var act=b.dataset.act,mact=b.dataset.mact;
  if(b.id==='nav-prev'){mudarMes(-1);return;}
  if(b.id==='nav-next'){mudarMes(1);return;}
  if(b.id==='btn-hoje'){var d=new Date();viewY=d.getFullYear();viewM=d.getMonth();render();return;}
  if(b.id==='btn-editor'){if(sessao)fazerLogout();else pedirLogin();return;}
  if(b.id==='btn-novo'){abrirForm(null);return;}
  if(b.id==='btn-importar'){importarSeed();return;}
  if(b.id==='btn-ics'){exportarICS();return;}
  if(b.id==='btn-usuarios'){abrirUsuarios();return;}
  if(b.id==='btn-gerar-convite'){gerarConvite();return;}
  if(b.dataset.ua==='remover'){removerUsuario(b.dataset.email);return;}
  if(b.classList&&b.classList.contains('vt')){setViewMode(b.dataset.view);return;}
  if(b.classList&&b.classList.contains('lg')){
    var cat=b.dataset.cat;
    if(!filtroCats)filtroCats=CATS.map(function(c){return c.id;});
    var idx=filtroCats.indexOf(cat);
    if(idx>=0)filtroCats.splice(idx,1);else filtroCats.push(cat);
    if(filtroCats.length===CATS.length)filtroCats=null;
    render();return;
  }
  if(act==='abrir'){abrirDetalhe(b.dataset.id);return;}
  if(act==='mais'){
    var dia=b.dataset.dia,its=events.filter(eventoVisivel).filter(function(x){return x.dataInicio===dia&&x.dataFim===dia;});
    showModal('<h3>'+esc(fmtBR(dia))+'</h3>'+its.map(function(it){var cat=CAT_BY_ID[it.categoria];return '<div class="ev-row" style="display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer" data-act="abrir" data-id="'+esc(it.id)+'"><span class="dot catdot-'+cat.id+'" style="width:9px;height:9px;border-radius:50%;flex:none"></span>'+esc(it.titulo)+'</div>';}).join('')
      +'<div class="btns"><button type="button" class="btn ghost small" data-mact="cancel">Fechar</button></div>');
    return;
  }
  if(mact==='cancel'){hideModal();return;}
  if(mact==='login'){fazerLogin();return;}
  if(mact==='resgatar'){resgatarConvite(b.dataset.token);return;}
  if(mact==='salvar'){salvarForm();return;}
  if(mact==='editar'){var it=events.filter(function(x){return x.id===editId;})[0];hideModal();abrirForm(it);return;}
  if(mact==='duplicar'){
    var orig=events.filter(function(x){return x.id===editId;})[0];
    hideModal();
    if(orig)abrirForm(Object.assign({},orig,{id:null}));
    return;
  }
  if(mact==='excluir'){
    if(!b.dataset.arm){b.dataset.arm='1';b.dataset.o=b.textContent;b.textContent='Confirmar exclusão';clearTimeout(b._t);b._t=setTimeout(function(){b.dataset.arm='';b.textContent=b.dataset.o;},3500);return;}
    excluir(b.dataset.id);return;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='m-senha')fazerLogin();
});
document.addEventListener('change',function(e){
  if(e.target.id==='f-canal'){filtroCanal=e.target.value;render();}
  if(e.target.id==='f-resp'){filtroResp=e.target.value;render();}
  if(e.target.id==='f-grupo'){filtroGrupo=e.target.value;render();}
  if(e.target.id==='m-categoria'){
    var lemb=$('m-lembrete');
    if(lemb&&lemb.value===''&&e.target.value==='feriado')lemb.value='5';
  }
  if(e.target.dataset&&e.target.dataset.ua==='role'){mudarRoleUsuario(e.target.dataset.email,e.target.value);}
});
var buscaTimer=null;
document.addEventListener('input',function(e){
  if(e.target.id==='f-busca'){
    clearTimeout(buscaTimer);
    var val=e.target.value;
    buscaTimer=setTimeout(function(){filtroBusca=val.trim().toLowerCase();render();},150);
  }
});

setViewMode(viewMode);
carregar();
})();
</script>
